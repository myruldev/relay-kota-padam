<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay: Kota Padam</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: #e6ecf7; }
  #app { height: 100%; }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 14px 18px 10px; gap: 10px; }
  .hud { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .hud-left, .hud-right { display: flex; align-items: center; gap: 18px; }
  .hud-level, .hud-score { font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  .hud-score { color: #fbbf24; }
  .battery-wrap { display: flex; align-items: center; gap: 8px; }
  .battery-label { font-size: 13px; color: #8ea0c2; }
  .battery-bar { width: 150px; height: 12px; border: 1px solid #22305a; border-radius: 999px; overflow: hidden; background: #0e1526; }
  .battery-fill { height: 100%; background: #4ade80; border-radius: 999px; transition: width 0.18s ease; }
  .icon-btn { background: #1d2c52; border: 1px solid #3b5b9e; color: #e6ecf7; border-radius: 8px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
  .icon-btn:hover { background: #27396b; }
  .stage { flex: 1; min-height: 0; position: relative; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
  .hint { text-align: center; font-size: 13px; color: #8ea0c2; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5, 8, 18, 0.72); z-index: 10; }
  .overlay.hidden { display: none; }
  .card { width: min(560px, 92vw); background: #111831; border: 1px solid #22305a; border-radius: 16px; padding: 28px 30px 24px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55); }
  .card h1 { margin: 0 0 10px; font-size: 30px; line-height: 1.15; }
  .card p { margin: 0 0 12px; font-size: 16px; line-height: 1.55; color: #c6d2e8; }
  .card p.tagline { color: #e6ecf7; font-size: 17px; }
  .card p.meta { color: #8ea0c2; font-size: 14px; }
  .card b { color: #fbbf24; }
  .card-buttons { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn { background: #f59e0b; color: #1a1206; border: none; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn:hover { background: #fbbf24; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
